#  Pulsarr Home Assistant Add-on -- nginx reverse proxy.
#
#  Why nginx is in the way:
#
#  Home Assistant's Ingress shows the add-on to the user as
#    https://<ha>/api/hassio_ingress/<TOKEN>/...
#  but Supervisor STRIPS that prefix before forwarding to the add-on -- the
#  add-on receives `GET /...`, not `GET /api/hassio_ingress/<TOKEN>/...`.
#  Pulsarr therefore answers correctly to API calls (Fastify routes are mounted
#  under /), but its frontend serves redirects and a `<base href="/">` that
#  point at the apex of `<ha>`, so the user falls out of the Ingress scope and
#  HA returns 404 for `/create-user`, `/login`, etc.
#
#  HA Supervisor passes the rotating prefix to the add-on in the `X-Ingress-Path`
#  request header (documented at
#  https://developers.home-assistant.io/docs/add-ons/presentation#ingress).
#  We pick that header up here and use it to:
#    * rewrite `Location:` headers from `/foo` -> `<X-Ingress-Path>/foo`
#    * rewrite `Set-Cookie: Path=/` to `Set-Cookie: Path=<X-Ingress-Path>/`
#    * patch `<base href="/">` in the served HTML to
#      `<base href="<X-Ingress-Path>/">`, so the SPA's relative asset URLs
#      resolve through Ingress (and survive the ~8h token rotation without
#      restarting Pulsarr).
#
#  Pulsarr itself runs on 127.0.0.1:8989 with the default `basePath=/`. nginx
#  binds the add-on's `ingress_port` (3003) and is the only thing HA Supervisor
#  talks to.
#
#  This is the same pattern alexbelgium/hassio-addons and dozens of other
#  community add-ons use to wrap apps that don't speak Ingress natively.

worker_processes  1;
pid               /var/run/nginx.pid;
error_log         stderr warn;
# Run in classic daemon mode -- nginx forks master+workers and returns. The
# add-on's run.sh launches nginx and then `exec`s into Pulsarr (which becomes
# PID 1 under tini), so we don't need nginx to stay in the foreground.

events {
    worker_connections 1024;
}

http {
    include                 /etc/nginx/mime.types;
    default_type            application/octet-stream;

    # Stream every proxied request to stdout so it shows up in the add-on's
    # Log tab. Cheap to enable, invaluable when diagnosing whether HA Ingress
    # actually reaches us or whether traffic gets routed elsewhere.
    log_format ingress_access '$remote_addr "$request" -> $status '
                              '($bytes_sent bytes) prefix="$ingress_prefix" '
                              'ua="$http_user_agent"';
    access_log              /dev/stdout ingress_access;

    sendfile                on;
    tcp_nopush              on;
    tcp_nodelay             on;
    keepalive_timeout       120s;
    server_tokens           off;

    # Pulsarr can stream large responses (e.g. anime DB sync, watchlist sync);
    # don't buffer them in nginx.
    proxy_buffering         off;
    proxy_request_buffering off;
    proxy_http_version      1.1;
    proxy_read_timeout      300s;
    proxy_send_timeout      300s;

    # Pulsarr does not currently brotli/gzip its own responses, but if the
    # upstream toolchain ever flips that on, sub_filter would silently no-op
    # against compressed bytes. Force identity from upstream.
    proxy_set_header        Accept-Encoding "";

    # WebSocket upgrade plumbing for any future realtime endpoints.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # The rotating Ingress prefix is delivered in the X-Ingress-Path header
    # by HA Supervisor (see top-of-file comment). $ingress_prefix is empty
    # for direct port access, in which case we degrade to a pass-through.
    map $http_x_ingress_path $ingress_prefix {
        default $http_x_ingress_path;
        ""      "";
    }

    # The string we substitute into rewritten Location headers and cookies.
    # When the prefix is empty we keep the upstream value as-is by rewriting
    # to a single "/" -- which is a no-op for `proxy_redirect / /`.
    map $ingress_prefix $ingress_prefix_or_root {
        default "$ingress_prefix/";
        ""      "/";
    }

    # Public scheme used for ABSOLUTE redirect URLs. HA Ingress always serves
    # the user over HTTPS, but Supervisor talks to the add-on over plain HTTP
    # on :3003 -- so $scheme is "http". If we used $scheme verbatim in
    # rewritten Location headers, Safari and Chromium would block them as
    # mixed content (https:// page requesting http:// resource). When the
    # request arrives via HA Ingress (X-Ingress-Path is set), force https://;
    # for direct port-mapped access we keep $scheme.
    map $http_x_ingress_path $public_scheme {
        default https;
        ""      $scheme;
    }

    # Don't append nginx's own listen port (:3003) to redirects. Public HA is
    # behind 8123/443; surfacing :3003 in Location headers would either fail
    # to route or trigger mixed-content rules.
    port_in_redirect off;

    server {
        listen 3003 default_server;
        listen [::]:3003 default_server;
        server_name _;

        client_max_body_size       32m;
        client_body_buffer_size    128k;

        # Single catch-all location: HA Supervisor strips its own ingress
        # prefix before forwarding, so what reaches us is always `GET /...`.
        # We forward upstream as-is and patch only the responses.
        location / {
            # Patch the SPA bootstrap HTML so relative URLs (assets, fetch
            # calls, router targets) resolve under the current Ingress prefix
            # on the client. Empty $ingress_prefix means direct port access
            # without Ingress -- in that case we leave `<base href="/">`
            # intact (the substitution string is identical to the source).
            # text/html is the default sub_filter_types; no need to redeclare.
            sub_filter_once on;
            sub_filter '<base href="/">' '<base href="$ingress_prefix_or_root">';

            proxy_pass http://127.0.0.1:8989;

            proxy_set_header Host                 $host;
            proxy_set_header X-Real-IP            $remote_addr;
            proxy_set_header X-Forwarded-For      $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto    $scheme;
            proxy_set_header X-Forwarded-Prefix   $ingress_prefix;
            # Pass through the upstream X-Ingress-Path verbatim, in case
            # downstream services want to read it (some Pulsarr plugins might).
            proxy_set_header X-Ingress-Path       $http_x_ingress_path;
            proxy_set_header Accept-Encoding      "";
            proxy_set_header Upgrade              $http_upgrade;
            proxy_set_header Connection           $connection_upgrade;

            # Pulsarr issues redirects like `Location: /create-user`. Without
            # rewriting, the browser would chase that path outside the Ingress
            # scope and HA would return a 404. We rewrite both the relative
            # form (Fastify's default) and the absolute form (which appears
            # when Pulsarr sees a `Host:` header it considers external) to a
            # full HTTPS URL pointing at the public HA hostname so the browser
            # never sees mixed content. $public_scheme falls back to $scheme
            # for direct port-mapped access (no Ingress).
            proxy_redirect ~^https?://[^/]+(/.*)$ $public_scheme://$host$ingress_prefix$1;
            proxy_redirect ~^/(.*)$              $public_scheme://$host$ingress_prefix/$1;

            # Re-scope cookies issued by Pulsarr (Path=/) to the Ingress prefix
            # so the browser only sends them along Ingress traffic, not for any
            # unrelated path on the HA frontend.
            proxy_cookie_path / $ingress_prefix_or_root;
        }
    }
}
