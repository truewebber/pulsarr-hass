#  Pulsarr Home Assistant Add-on — nginx reverse proxy.
#
#  Why nginx is in the way:
#
#  Home Assistant's Ingress proxies the add-on under
#    /api/hassio_ingress/<TOKEN>/...
#  and that <TOKEN> is regenerated by Supervisor roughly every 8 hours
#  (https://developers.home-assistant.io/docs/add-ons/presentation#ingress).
#
#  Pulsarr can serve under a sub-path via the `basePath` env var, but it reads
#  that variable once at startup. As soon as Supervisor rotates the token, the
#  prefix Pulsarr knows about no longer matches the prefix browsers are sending
#  in -- every request misses every Fastify route and the user sees JSON 404s.
#
#  Restarting Pulsarr on every rotation is unacceptable, so we instead:
#    * run Pulsarr at 127.0.0.1:8989 with an empty/default basePath ("/")
#    * run nginx on 0.0.0.0:3003 (the add-on's ingress_port)
#    * strip the rotating /api/hassio_ingress/<TOKEN> prefix in nginx
#    * rewrite redirects from upstream so Location headers gain the prefix back
#    * patch <base href="/"> in the served HTML to <base href="$prefix/">,
#      so the SPA's relative asset URLs resolve through Ingress
#
#  This is the same pattern alexbelgium/hassio-addons and dozens of other
#  community add-ons use to wrap apps that don't speak Ingress natively.

worker_processes  1;
pid               /var/run/nginx.pid;
error_log         stderr warn;
daemon            off;

events {
    worker_connections 1024;
}

http {
    include                 /etc/nginx/mime.types;
    default_type            application/octet-stream;
    access_log              off;

    sendfile                on;
    tcp_nopush              on;
    tcp_nodelay             on;
    keepalive_timeout       120s;
    server_tokens           off;

    # Pulsarr can stream large responses (e.g. anime DB sync, watchlist sync);
    # don't buffer them in nginx.
    proxy_buffering         off;
    proxy_request_buffering off;
    proxy_http_version      1.1;
    proxy_read_timeout      300s;
    proxy_send_timeout      300s;

    # Pulsarr does not currently brotli/gzip its own responses, but if the
    # upstream toolchain ever flips that on, sub_filter would silently no-op
    # against compressed bytes. Force identity from upstream.
    proxy_set_header        Accept-Encoding "";

    # WebSocket upgrade plumbing for any future realtime endpoints.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 3003 default_server;
        listen [::]:3003 default_server;
        server_name _;

        client_max_body_size       32m;
        client_body_buffer_size    128k;

        # Path that arrives via Home Assistant Ingress.
        # Named captures expose the rotating prefix to sub_filter / proxy_redirect
        # without resorting to `if ... { set }`.
        location ~ "^(?<ingress_prefix>/api/hassio_ingress/[^/]+)(/.*)?$" {
            # Strip the Ingress prefix before forwarding to Pulsarr. The trailing
            # `/?` lets us also match the bare prefix without a slash.
            rewrite ^/api/hassio_ingress/[^/]+/?(.*)$ /$1 break;

            # Patch the SPA bootstrap HTML so relative URLs (assets, fetch calls,
            # routing) resolve under the current Ingress prefix on the client.
            # text/html is the default sub_filter_types; no need to redeclare it.
            sub_filter_once on;
            sub_filter '<base href="/">' '<base href="$ingress_prefix/">';

            proxy_pass http://127.0.0.1:8989;

            proxy_set_header Host                 $host;
            proxy_set_header X-Real-IP            $remote_addr;
            proxy_set_header X-Forwarded-For      $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto    $scheme;
            proxy_set_header X-Forwarded-Prefix   $ingress_prefix;
            proxy_set_header X-Ingress-Path       $ingress_prefix;
            proxy_set_header Accept-Encoding      "";
            proxy_set_header Upgrade              $http_upgrade;
            proxy_set_header Connection           $connection_upgrade;

            # Pulsarr issues redirects like `Location: /create-user`. Without
            # rewriting, the browser would chase that path outside the Ingress
            # scope and Home Assistant would return a 404. We handle both the
            # relative form (Fastify's default) and the absolute form (which
            # appears when Pulsarr sees a `Host:` header it considers external).
            proxy_redirect ~^https?://[^/]+(/.*)$ $ingress_prefix$1;
            proxy_redirect ~^/(.*)$              $ingress_prefix/$1;

            # Re-scope cookies issued by Pulsarr (Path=/) to the Ingress prefix
            # so the browser only sends them along Ingress traffic, not for any
            # unrelated path on the Home Assistant frontend.
            proxy_cookie_path / "$ingress_prefix/";
        }

        # Direct port access (mapped to 3003 on the host) -- useful for debugging
        # or when running outside Home Assistant. No prefix to worry about.
        location / {
            proxy_pass http://127.0.0.1:8989;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade           $http_upgrade;
            proxy_set_header Connection        $connection_upgrade;
        }
    }
}
