name: Builder

on:
  push:
    branches: [master]
    paths:
      - "pulsarr/**"
      - ".github/workflows/builder.yaml"
  pull_request:
    branches: [master]
    paths:
      - "pulsarr/**"
      - ".github/workflows/builder.yaml"
  release:
    types: [published]
  workflow_dispatch: {}

env:
  ARCHITECTURES: '["amd64", "aarch64"]'
  IMAGE_NAME: pulsarr-hass
  ADDON_DIR: pulsarr
  PULSARR_UPSTREAM: "lakker/pulsarr:0.15.5"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  init:
    name: Initialize build
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      version: ${{ steps.meta.outputs.version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Read add-on metadata
        id: meta
        run: |
          set -euo pipefail
          version="$(yq -r '.version' "${ADDON_DIR}/config.yaml")"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Get build matrix
        id: matrix
        uses: home-assistant/builder/actions/prepare-multi-arch-matrix@2026.03.2
        with:
          architectures: ${{ env.ARCHITECTURES }}
          image-name: ${{ env.IMAGE_NAME }}

  build:
    name: Build ${{ matrix.arch }} image
    needs: init
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.init.outputs.matrix) }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Build image
        uses: home-assistant/builder/actions/build-image@2026.03.2
        with:
          arch: ${{ matrix.arch }}
          context: ./${{ env.ADDON_DIR }}
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}
          image: ${{ matrix.image }}
          image-tags: |
            ${{ needs.init.outputs.version }}
            latest
          build-args: |
            BUILD_FROM=${{ env.PULSARR_UPSTREAM }}
          version: ${{ needs.init.outputs.version }}
          push: ${{ github.event_name != 'pull_request' }}
          cosign: ${{ github.event_name != 'pull_request' }}

  manifest:
    name: Publish multi-arch manifest
    needs: [init, build]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      packages: write
    steps:
      - name: Publish multi-arch manifest
        uses: home-assistant/builder/actions/publish-multi-arch-manifest@2026.03.2
        with:
          architectures: ${{ env.ARCHITECTURES }}
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}
          image-name: ${{ env.IMAGE_NAME }}
          image-tags: |
            ${{ needs.init.outputs.version }}
            latest
